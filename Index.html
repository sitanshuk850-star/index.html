        function updateLivePreview() {
            const html = generateHTMLCode();
            const frame = document.getElementById('preview-frame');
            const doc = frame.contentDocument || frame.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();
        }

        function setViewport(mode) {
            const wrapper = document.getElementById('preview-wrapper');
            const label = document.getElementById('viewport-label');
            const btnD = document.getElementById('btn-view-desktop');
            const btnT = document.getElementById('btn-view-tablet');
            const btnM = document.getElementById('btn-view-mobile');

            [btnD, btnT, btnM].forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('text-slate-400');
            });

            wrapper.className = "preview-container bg-white text-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-700/50 transition-all duration-300 ";

            if (mode === 'desktop') {
                wrapper.classList.add('preview-desktop');
                label.innerText = '100% Full Width (Desktop)';
                btnD.classList.add('bg-indigo-600', 'text-white');
            } else if (mode === 'tablet') {
                wrapper.classList.add('preview-tablet');
                label.innerText = '768px Width (Tablet)';
                btnT.classList.add('bg-indigo-600', 'text-white');
            } else if (mode === 'mobile') {
                wrapper.classList.add('preview-mobile');
                label.innerText = '375px Width (Mobile)';
                btnM.classList.add('bg-indigo-600', 'text-white');
            }
        }

        function openCodeModal() {
            document.getElementById('code-output').innerText = generateHTMLCode();
            document.getElementById('code-modal').classList.remove('hidden');
        }

        function closeCodeModal() {
            document.getElementById('code-modal').classList.add('hidden');
        }

        function copyToClipboard() {
            const code = generateHTMLCode();
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = code;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            showToast("HTML code clipboard me copy ho gaya hai!");
        }

        function downloadWebsite() {
            const code = generateHTMLCode();
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${document.getElementById('input-brand').value.toLowerCase().replace(/\s+/g, '-')}-index.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast("Aapki index.html file download ho gayi!");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Initialize on Load
        window.onload = function() {
            updateLivePreview();
        };
    </script>
</body>
</html>
